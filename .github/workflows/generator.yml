name: Generate Medical Video

on:
  schedule:
    # Daily every day at 16:00 UTC
    - cron: '0 16 * * *'
    # Extra Sunday episode at 20:00 UTC (2 videos on Sunday)
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: medical-video-generator
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Media Tools (FFmpeg & Fonts)
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            echo "✅ FFmpeg and DejaVu fonts are already pre-installed! Skipping apt-get (0 seconds)."
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent (Single-Pass Turbo Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -u main.py

      - name: Publish Video & Thumbnail to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="episode-$(date +'%Y-%m-%d-%H-%M')"
          TITLE_DATE="$(date +'%Y-%m-%d %H:%M UTC')"
          if [ -f thumbnail.jpg ]; then
            gh release create "$TAG_NAME" final_video.mp4 thumbnail.jpg --title "🎬 Medical Episode ($TITLE_DATE)" --notes-file youtube_details.txt
          else
            gh release create "$TAG_NAME" final_video.mp4 --title "🎬 Medical Episode ($TITLE_DATE)" --notes-file youtube_details.txt
          fi

      - name: Save Memory (Prevent Repeating News & Video Clips)
        if: success()
        continue-on-error: true
        run: |
          cp used_news.txt /tmp/used_news_backup.txt || true
          cp used_videos.txt /tmp/used_videos_backup.txt || true
          git config --global user.name "Medical AI Agent"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/used_news_backup.txt used_news.txt || true
          cp /tmp/used_videos_backup.txt used_videos.txt || true
          git add used_news.txt used_videos.txt
          git diff --staged --quiet || git commit -m "Update memory: used news and video clips [skip ci]"
          git push origin main
