name: Generate Medical Video

on:
  schedule:
    # Daily every day at 16:00 UTC
    - cron: '0 16 * * *'
    # Extra Sunday episode at 20:00 UTC (2 videos on Sunday)
    - cron: '0 16,20 * * 0'
  workflow_dispatch:

concurrency:
  group: medical-video-generator
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Pre-installed Media & Fonts (Zero apt-get)
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/dejavu
          SYS_BOLD=$(find /usr/share/fonts -iname "*bold*.ttf" | head -n 1)
          SYS_REG=$(find /usr/share/fonts -iname "*.ttf" ! -iname "*bold*" | head -n 1)
          if [ -z "$SYS_BOLD" ]; then SYS_BOLD="$SYS_REG"; fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] && [ -n "$SYS_BOLD" ]; then
            sudo cp "$SYS_BOLD" /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] && [ -n "$SYS_REG" ]; then
            sudo cp "$SYS_REG" /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          fi
          ffmpeg -version | head -n 1
          echo "✅ Media tools & fonts ready in 0.1s without apt-get!"

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent (Full Features + Thumbnail + Fast Render)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -u main.py

      - name: Publish Video & Thumbnail to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="episode-$(date +'%Y-%m-%d-%H-%M')"
          TITLE_DATE="$(date +'%Y-%m-%d %H:%M UTC')"
          if [ -f thumbnail.jpg ]; then
            gh release create "$TAG_NAME" final_video.mp4 thumbnail.jpg --title "🎬 Medical Episode ($TITLE_DATE)" --notes-file youtube_details.txt
          else
            gh release create "$TAG_NAME" final_video.mp4 --title "🎬 Medical Episode ($TITLE_DATE)" --notes-file youtube_details.txt
          fi

      - name: Save Memory (Prevent Repeating News & Video Clips)
        if: success()
        continue-on-error: true
        run: |
          cp used_news.txt /tmp/used_news_backup.txt || true
          cp used_videos.txt /tmp/used_videos_backup.txt || true
          git config --global user.name "Medical AI Agent"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/used_news_backup.txt used_news.txt || true
          cp /tmp/used_videos_backup.txt used_videos.txt || true
          git add used_news.txt used_videos.txt
          git diff --staged --quiet || git commit -m "Update memory: used news and video clips [skip ci]"
          git push origin main
