name: Daily Medical Video Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Medical AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py

      - name: Save Used News and Videos History
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          touch used_news.txt used_videos.txt
          git add used_news.txt used_videos.txt
          git diff --staged --quiet || git commit -m "Update used news and video clips history"
          git push

      - name: Create Release with Video and Details
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ github.run_number }}
          name: "MedPulse 5 Episode #${{ github.run_number }}"
          body: "Automated HD Medical Video and YouTube Metadata"
          files: |
            final_video.mp4
            youtube_details.txt
