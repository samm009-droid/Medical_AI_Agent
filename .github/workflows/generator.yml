name: Daily Medical Video AI Agent

on:
  workflow_dispatch:
  schedule:
    # 1. Daily Video (Monday to Sunday) at Peak US/Europe Overlap (16:00 UTC)
    - cron: '0 16 * * *'
    # 2. Second Sunday Video at US/Europe Evening Peak (20:00 UTC on Sundays)
    - cron: '0 20 * * 0'

concurrency:
  group: medical-video-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build_medical_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Media Tools (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install AI Agent Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Medical AI Agent (Generate Video + Custom Thumbnail)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python main.py
          ls -lh final_video.mp4 thumbnail.jpg

      - name: Publish Video, Thumbnail & YouTube Details for Mobile Download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="video-$(date +'%Y-%m-%d-%H%M%S')"
          TITLE_DATE="$(date +'%Y-%m-%d %H:%M') UTC"
          gh release create "$TAG_NAME" final_video.mp4 thumbnail.jpg \
            --title "🎬 Medical Episode ($TITLE_DATE)" \
            --notes-file youtube_details.txt

      - name: Save Agent News & Video Memory Safely (Zero Repetition)
        continue-on-error: true
        run: |
          git config user.name "Medical-AI-Bot"
          git config user.email "bot@github.com"
          cp used_news.txt /tmp/used_news_backup.txt 2>/dev/null || true
          cp used_videos.txt /tmp/used_videos_backup.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/used_news_backup.txt used_news.txt 2>/dev/null || true
          cp /tmp/used_videos_backup.txt used_videos.txt 2>/dev/null || true
          git add used_news.txt used_videos.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update permanent news and video clip memory"
          git push origin main || true
